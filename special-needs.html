<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kebutuhan Khusus - Infant Nutrition Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Text:wght@400;600&display=swap');
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
      Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #e0e0e0 0%, #f5f7fa 100%);
    color: #1c1c1e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }
  .container {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(20px);
    padding: 2.5rem 3rem;
    border-radius: 12px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  h1 {
    text-align: center;
    font-weight: 700;
    font-size: 2.2rem;
    margin-bottom: 2rem;
    user-select: none;
  }
  form {
    display: flex;
    flex-direction: column;
  }
  label {
    font-weight: 600;
    margin-bottom: 0.3rem;
    font-size: 0.9rem;
    color: #1d1d1f;
  }
  textarea {
    padding: 0.7rem 1rem;
    border-radius: 12px;
    border: 1px solid #c7c7cc;
    margin-bottom: 1.5rem;
    font-size: 1rem;
    outline: none;
    resize: vertical;
    min-height: 80px;
    color: #000;
  }
  textarea::placeholder {
    color: #999;
  }
  button.submit-btn {
    background-color: #007aff;
    border: none;
    padding: 0.9rem 1rem;
    font-size: 1.1rem;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.3s ease;
  }
  button.submit-btn:hover {
    background-color: #005fcc;
  }
  @media (max-width: 500px) {
    .container {
      padding: 2rem 1.5rem;
    }
  }
</style>
</head>
<body>
  <div class="container" role="main" aria-label="Formulir Kebutuhan Khusus - Infant Nutrition Calendar">
    <h1>Kebutuhan Khusus</h1>
    <form id="specialNeedsForm" onsubmit="handleSubmit(event)" aria-label="Formulir kebutuhan khusus">
      <label for="allergies">Alergi Apa?</label>
      <textarea id="allergies" name="allergies" placeholder="Tuliskan alergi anak jika ada"></textarea>

      <label for="foodIntolerance">Alergi atau Tidak Cocok dengan Makanan Apa?</label>
      <textarea id="foodIntolerance" name="foodIntolerance" placeholder="Tuliskan makanan yang tidak cocok atau menyebabkan alergi"></textarea>

      <label for="congenitalDiseases">Penyakit Bawaan Apa?</label>
      <textarea id="congenitalDiseases" name="congenitalDiseases" placeholder="Tuliskan penyakit bawaan jika ada"></textarea>

      <button type="submit" class="submit-btn">Kirim</button>
    </form>
  </div>

<script>
  function handleSubmit(event) {
    event.preventDefault();
    const form = event.target;
    const data = {
      allergies: form.allergies.value.trim() || '-',
      foodIntolerance: form.foodIntolerance.value.trim() || '-',
      congenitalDiseases: form.congenitalDiseases.value.trim() || '-'
    };

    alert(
      `Data Kebutuhan Khusus:\n` +
      `Alergi: ${data.allergies}\n` +
      `Alergi/Tidak Cocok Dengan Makanan: ${data.foodIntolerance}\n` +
      `Penyakit Bawaan: ${data.congenitalDiseases}`
    );

    form.reset();

    // Redirect to parent data form
    window.location.href = 'parent-data.html';
  }
</script>
</body>
</html>
