<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Parent Data Form - Infant Nutrition Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Text:wght@400;600&display=swap');
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
      Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #e0e0e0 0%, #f5f7fa 100%);
    color: #1c1c1e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }
  .container {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(20px);
    padding: 2.5rem 3rem;
    border-radius: 12px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  h1 {
    text-align: center;
    font-weight: 700;
    font-size: 2.2rem;
    margin-bottom: 2rem;
    user-select: none;
  }
  form {
    display: flex;
    flex-direction: column;
  }
  label {
    font-weight: 600;
    margin-bottom: 0.3rem;
    font-size: 0.9rem;
    color: #1d1d1f;
  }
  input[type="text"],
  input[type="tel"],
  input[type="date"],
  textarea {
    padding: 0.7rem 1rem;
    border-radius: 12px;
    border: 1px solid #c7c7cc;
    margin-bottom: 1.5rem;
    font-size: 1rem;
    outline: none;
    resize: vertical;
  }
  input::placeholder,
  textarea::placeholder {
    color: #999;
  }
  button.submit-btn {
    background-color: #007aff;
    border: none;
    padding: 0.9rem 1rem;
    font-size: 1.1rem;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.3s ease;
  }
  button.submit-btn:hover {
    background-color: #005fcc;
  }
  @media (max-width: 500px) {
    .container {
      padding: 2rem 1.5rem;
    }
  }
</style>
</head>
<body>
  <div class="container" role="main" aria-label="Formulir Data Orang Tua - Infant Nutrition Calendar">
    <h1>Parent Data</h1>
    <form id="parentDataForm" onsubmit="handleSubmit(event)" aria-label="Formulir data orang tua">
      <label for="name">Nama</label>
      <input type="text" id="name" name="name" placeholder="Masukkan nama lengkap" required aria-required="true" />

      <label for="birthPlace">Tempat Lahir</label>
      <input type="text" id="birthPlace" name="birthPlace" placeholder="Masukkan tempat lahir" required aria-required="true" />

      <label for="birthDate">Tanggal Lahir</label>
      <input type="date" id="birthDate" name="birthDate" required aria-required="true" max="" />

      <label for="domicile">Domisili</label>
      <input type="text" id="domicile" name="domicile" placeholder="Masukkan domisili saat ini" required aria-required="true" />

      <label for="phone">No. Telepon</label>
      <input type="tel" id="phone" name="phone" placeholder="Masukkan nomor telepon" required aria-required="true" pattern="[0-9+\-\s]+" />

      <label for="medicalHistory">Riwayat Penyakit Orang Tua</label>
      <textarea id="medicalHistory" name="medicalHistory" placeholder="Tuliskan riwayat penyakit orang tua" rows="4" aria-multiline="true"></textarea>

      <button type="submit" class="submit-btn">Kirim</button>
    </form>
  </div>

<script>
  // Set max date for birthDate input to today
  document.getElementById('birthDate').max = new Date().toISOString().split('T')[0];

  function handleSubmit(event) {
    event.preventDefault();
    const form = event.target;
    const data = {
      name: form.name.value.trim(),
      birthPlace: form.birthPlace.value.trim(),
      birthDate: form.birthDate.value,
      domicile: form.domicile.value.trim(),
      phone: form.phone.value.trim(),
      medicalHistory: form.medicalHistory.value.trim(),
    };

    if(!data.name || !data.birthPlace || !data.birthDate || !data.domicile || !data.phone) {
      alert('Mohon lengkapi semua kolom wajib.');
      return;
    }

    alert(
      `Data Orang Tua:\n` +
      `Nama: ${data.name}\n` +
      `Tempat Lahir: ${data.birthPlace}\n` +
      `Tanggal Lahir: ${data.birthDate}\n` +
      `Domisili: ${data.domicile}\n` +
      `No. Telepon: ${data.phone}\n` +
      `Riwayat Penyakit: ${data.medicalHistory || '-'}` 
    );

    form.reset();

    // Redirect to subscription plans page after submission
    window.location.href = 'subscription-plan.html';
  }
</script>
</body>
</html>
